name: Release

# 打 tag（v*）即自动发布：校验单文件控制台是最新嵌入 → 打包 → 创建 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch），版本取自 .claude-plugin/plugin.json。
# 根治两个长期隐患：① 改了 knowledge/ 忘重嵌 ② Release 永远落后于代码。
# 本流程只发布 GitHub Release，不负责官方 hosted 部署。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验单文件控制台是最新嵌入
        # 重跑本地 embed（纯标准库），若 app/greenroom.html 会变=有人改了 knowledge/ 或
        # examples/ 却忘了重嵌 → 直接失败。头像 embed-avatars.py 需联网/DiceBear，这里不校验，
        # 岗位英文名变动时手动跑。
        run: |
          python3 tools/embed-knowledge.py
          python3 tools/embed-demo.py
          if ! git diff --quiet -- app/greenroom.html; then
            echo "::error::app/greenroom.html 过期。先跑 tools/embed-knowledge.py + tools/embed-demo.py（岗位变动再跑 embed-avatars.py），提交后再打 tag。"
            git --no-pager diff --stat -- app/greenroom.html
            exit 1
          fi
          echo "控制台与 knowledge/、examples/ 同步。"

      - name: 解析版本与 tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            VER="$(grep -m1 '"version"' .claude-plugin/plugin.json | sed -E 's/.*"version" *: *"([^"]+)".*/\1/')"
            TAG="v${VER}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布 $TAG（版本 $VER）"

      - name: 打包产物（单文件控制台 + bundle.zip）
        run: |
          mkdir -p dist
          cp app/greenroom.html dist/greenroom-console.html
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/greenroom"
          cp app/greenroom.html "$STAGE/greenroom/greenroom-console.html"
          cp serve.py README.md README.zh-CN.md LICENSE "$STAGE/greenroom/"
          cp -R skills docs "$STAGE/greenroom/"
          ( cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/dist/greenroom-bundle.zip" greenroom )
          ls -lh dist

      - name: 从 CHANGELOG 提取本版说明
        run: |
          awk -v ver="## v${{ steps.ver.outputs.ver }}" '
            $0 ~ "^" ver {f=1}
            f && /^## v/ && $0 !~ ver {exit}
            f
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "greenroom ${{ steps.ver.outputs.tag }}" > dist/notes.md
          fi
          echo "--- notes ---"; cat dist/notes.md

      - name: 发布 GitHub Release（幂等，可重跑）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/greenroom-console.html dist/greenroom-bundle.zip --clobber
            gh release edit "$TAG" --title "greenroom $TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" \
              dist/greenroom-console.html dist/greenroom-bundle.zip \
              --title "greenroom $TAG" \
              --notes-file dist/notes.md
          fi

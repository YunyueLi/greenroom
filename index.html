<style>
  :root{color-scheme:light;--paper:#F5F3EE;--ink:#141310;--muted:#6F6A60;--stage:#0D3322;--line:#DDD8CC}
  *{box-sizing:border-box}
  body{min-height:100dvh;margin:0;display:grid;place-items:center;background:linear-gradient(180deg,#FAF9F5,var(--paper));color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 22px 60px rgba(20,19,16,.08)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .mark{width:34px;height:34px;border-radius:10px;background:#0D3322 url("/brand/icon-square.svg") center/cover no-repeat;box-shadow:0 12px 26px rgba(13,51,34,.18)}
  h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:0}
  p{margin:12px 0 0;color:var(--muted)}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:20px;padding:0 16px;border-radius:10px;background:var(--stage);color:#fff;text-decoration:none;font-weight:700}
</style>
<script>
  (function(){
    var target = "/app/greenroom.html";
    var params = new URLSearchParams(window.location.search || "");
    params.set("path", window.location.pathname || "/");
    params.set("v", Date.now().toString(36));
    var search = params.toString();
    window.location.replace(target + (search ? "?" + search : "") + window.location.hash);
  })();
</script>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>greenroom</h1></div>
  <p>正在打开 greenroom。如果没有自动跳转，请进入官方产品。</p>
  <a href="/app/greenroom.html?path=/">打开 greenroom</a>
</main>
</body>
